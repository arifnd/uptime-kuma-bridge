[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uptime-kuma-bridge"
version = "0.1.0"
description = "REST API bridge over Uptime Kuma 2.x Socket.IO"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "uptime-kuma-bridge contributors" }]
dependencies = [
    "fastapi>=0.143",
    "starlette>=1.7",
    "uvicorn[standard]>=0.54",
    "python-socketio[asyncio_client]>=5.17",
    "httpx2>=2.13",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.0",
    "prometheus-client>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
uptime-kuma-bridge = "uptime_kuma_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uptime_kuma_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: end-to-end tests against a real Socket.IO server"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["uptime_kuma_bridge"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
